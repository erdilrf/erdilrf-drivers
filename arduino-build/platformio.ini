; 编译验证工程 —— 目的只有一个：证明 arduino/src/ERDILRF_LRF.h 真的能编译。
;
; 为什么放在仓库里而不是临时目录：编译结果要作为【证据】留在交付物中。
; 默认 .gitignore 掉 .pio/（工具链与产物），但本文件与 src/main.cpp 保留。
;
; 用法：
;   cd arduino-build && pio run
;
; 目标板选 AVR 是刻意的：16 位 int、2KB RAM、无 FPU，
; 是最能暴露可移植性问题的环境。能在 AVR 上过，其它平台基本没问题。

[platformio]
default_envs = uno, nanoatmega328

[env]
framework = arduino
; 用 lib_extra_dirs 扫描父目录里的库（arduino/ 有 library.json，会被识别为库）。
; 不用 lib_deps = symlink://../arduino —— 实测报
;   MissingPackageManifestError: Could not find ... manifest files in the package
; 因为它会把路径解析成别的位置。lib_extra_dirs 直接扫描，不经过包安装器，更可靠。
lib_extra_dirs = ..
build_flags = -Wall -Wextra

[env:uno]
platform = atmelavr
board = uno

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
